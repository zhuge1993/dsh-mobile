<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DSH 移动端 · 连接</title>
<style>
:root{color-scheme:dark;--bg:#161616;--panel:#1c1c1e;--line:#2a2a2a;--text:#e8e8ea;--muted:#9a9aa2;--brand:#4dabf7;--ok:#34d399;--warn:#f5b942;--err:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
h1{font-size:18px;margin:0 0 6px;font-weight:600}
.sub{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.6}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
input{width:100%;background:#111;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px}
input:focus{outline:none;border-color:var(--brand)}
button{width:100%;margin-top:14px;border:1px solid var(--brand);background:var(--brand);color:#05121d;border-radius:8px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}
.err{display:none;margin-top:12px;border:1px solid var(--err);color:var(--err);border-radius:8px;padding:9px 11px;font-size:12px;word-break:break-all}
.hint{margin-top:16px;font-size:11px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<div class="card">
	<h1>DSH 移动端</h1>
	<p class="sub">经 paseo 免费中继连接你的电脑。通道端到端加密，中继只见密文；手机与电脑同一 Wi-Fi 时也可以直接用局域网地址。</p>
	<label for="link">配对链接</label>
	<input id="link" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="粘贴电脑「设置 → 移动设备」里的配对链接">
	<button id="connect">连接</button>
	<div class="status"><span id="dot" class="dot"></span><span id="text">等待连接</span></div>
	<div id="err" class="err"></div>
	<div class="hint">首次连接后建议在手机浏览器里「添加到主屏幕」。配对令牌只保存在本机浏览器，不会上传到任何服务器。</div>
</div>

<script src="nacl-fast.min.js"></script>
<script>
(function () {
	"use strict";
	var PAIR_KEY = "dsh-mobile-pairing";
	var NativeWebSocket = window.WebSocket;
	var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
	var ui = {
		link: document.getElementById("link"),
		connect: document.getElementById("connect"),
		dot: document.getElementById("dot"),
		text: document.getElementById("text"),
		err: document.getElementById("err")
	};
	var tunnel = null;
	var documentWritten = false;

	function setStatus(kind, text) {
		ui.dot.className = "dot" + (kind ? " " + kind : "");
		ui.text.textContent = text;
	}
	function showError(message) {
		ui.err.style.display = message ? "block" : "none";
		ui.err.textContent = message || "";
	}
	function bytesToB64(bytes) {
		var binary = "";
		var chunk = 0x8000;
		for (var i = 0; i < bytes.length; i += chunk) {
			binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
		}
		return btoa(binary);
	}
	function b64ToBytes(text) {
		var binary = atob(String(text || ""));
		var out = new Uint8Array(binary.length);
		for (var i = 0; i < binary.length; i += 1) out[i] = binary.charCodeAt(i);
		return out;
	}
	function utf8(text) { return new TextEncoder().encode(text); }
	function fromUtf8(bytes) { return new TextDecoder().decode(bytes); }

	function parseLink(text) {
		var raw = String(text || "").trim();
		var idx = raw.indexOf("#connect=");
		var uri = idx >= 0 ? decodeURIComponent(raw.slice(idx + "#connect=".length)) : raw;
		if (!uri.startsWith("relay://")) return null;
		try {
			var url = new URL(uri);
			var serverId = decodeURIComponent(url.pathname.replace(/^\//, ""));
			var key = url.searchParams.get("key") || "";
			if (!serverId || !key) return null;
			return {
				serverId: serverId,
				key: key,
				pair: url.searchParams.get("pair") || "",
				endpoint: url.host,
				useTls: url.searchParams.get("ssl") !== "false"
			};
		} catch (error) {
			return null;
		}
	}

	/* ── E2EE + relay ─────────────────────────────────────────────── */

	function Tunnel(link) {
		this.link = link;
		this.ws = null;
		this.shared = null;
		this.open = false;
		this.queue = [];
		this.nextId = 1;
		this.httpPending = new Map();
		this.virtualSockets = new Set();
		this.helloTimer = null;
		this.reconnectTimer = null;
		this.stopped = false;
		this.readyResolve = null;
		this.readyReject = null;
		this.helloKeyPair = null;
	}

	Tunnel.prototype.connect = function () {
		var self = this;
		return new Promise(function (resolve, reject) {
			self.readyResolve = resolve;
			self.readyReject = reject;
			self._openSocket();
		});
	};

	Tunnel.prototype._openSocket = function () {
		var self = this;
		if (self.stopped) return;
		var proto = self.link.useTls ? "wss" : "ws";
		var url = proto + "://" + self.link.endpoint + "/ws?serverId=" + encodeURIComponent(self.link.serverId)
			+ "&role=client&v=2";
		setStatus("warn", "连接中继…");
		var ws = new NativeWebSocket(url);
		ws.binaryType = "arraybuffer";
		self.ws = ws;
		var settled = false;
		var timeout = setTimeout(function () {
			if (settled) return;
			settled = true;
			try { ws.close(); } catch (e) {}
			self._fail("中继握手超时");
		}, 15000);

		ws.onopen = function () {
			var keyPair = nacl.box.keyPair();
			self.helloKeyPair = keyPair;
			self.shared = nacl.box.before(b64ToBytes(self.link.key), keyPair.secretKey);
			self._sendPlain({
				type: "e2ee_hello",
				key: bytesToB64(keyPair.publicKey)
			});
			setStatus("warn", "端到端加密握手…");
			self.helloTimer = setInterval(function () {
				if (self.open) return;
				self._sendPlain({ type: "e2ee_hello", key: bytesToB64(keyPair.publicKey) });
			}, 1200);
		};
		ws.onmessage = function (event) {
			var text = event.data;
			if (typeof text !== "string") {
				try { text = fromUtf8(new Uint8Array(text)); } catch (e) { return; }
			}
			if (!self.open) {
				var msg = null;
				try { msg = JSON.parse(text); } catch (e) { return; }
				if (msg && msg.type === "e2ee_ready") {
					self.open = true;
					clearTimeout(timeout);
					clearInterval(self.helloTimer);
					self.helloTimer = null;
					settled = true;
					setStatus("ok", "已连接（端到端加密）");
					var pending = self.queue;
					self.queue = [];
					pending.forEach(function (frame) { self._sendFrame(frame); });
					if (self.readyResolve) {
						var resolve = self.readyResolve;
						self.readyResolve = null;
						self.readyReject = null;
						resolve(self);
					}
				}
				return;
			}
			self._onCipher(text);
		};
		ws.onerror = function () {
			if (!self.open && !settled) {
				settled = true;
				clearTimeout(timeout);
				self._fail("无法连接中继");
			}
		};
		ws.onclose = function () {
			clearTimeout(timeout);
			clearInterval(self.helloTimer);
			self.helloTimer = null;
			self.open = false;
			self.ws = null;
			self._closeVirtualSockets();
			self.httpPending.forEach(function (pending) {
				clearTimeout(pending.timer);
				pending.reject(new Error("中继连接已断开"));
			});
			self.httpPending.clear();
			if (!settled) {
				settled = true;
				self._fail("中继连接已断开");
				return;
			}
			if (documentWritten && !self.stopped) {
				setStatus("warn", "中继断开，重连中…");
				self._scheduleReconnect();
			}
		};
	};

	Tunnel.prototype._scheduleReconnect = function () {
		var self = this;
		if (self.reconnectTimer || self.stopped) return;
		self.reconnectTimer = setTimeout(function () {
			self.reconnectTimer = null;
			if (self.open || self.stopped) return;
			self._openSocket();
		}, 1500);
	};

	Tunnel.prototype._fail = function (message) {
		setStatus("err", "连接失败");
		showError(message);
		if (this.readyReject) {
			var reject = this.readyReject;
			this.readyReject = null;
			this.readyResolve = null;
			reject(new Error(message));
		}
	};

	Tunnel.prototype._sendPlain = function (obj) {
		try {
			if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(obj));
		} catch (error) {}
	};

	Tunnel.prototype._sendFrame = function (frame) {
		if (!this.open || !this.shared) {
			if (this.queue.length < 200) this.queue.push(frame);
			return;
		}
		try {
			var nonce = nacl.randomBytes(nacl.box.nonceLength);
			var cipher = nacl.box.after(utf8(JSON.stringify(frame)), nonce, this.shared);
			var wire = new Uint8Array(nonce.length + cipher.length);
			wire.set(nonce, 0);
			wire.set(cipher, nonce.length);
			this.ws.send(bytesToB64(wire));
		} catch (error) {
			console.error("tunnel send failed", error);
		}
	};

	Tunnel.prototype._onCipher = function (text) {
		try {
			var wire = b64ToBytes(text);
			var nonce = wire.slice(0, nacl.box.nonceLength);
			var cipher = wire.slice(nacl.box.nonceLength);
			var plain = nacl.box.open.after(cipher, nonce, this.shared);
			if (!plain) throw new Error("decrypt failed");
			var frame = JSON.parse(fromUtf8(plain));
			this._dispatch(frame);
		} catch (error) {
			/* 单帧损坏不应拖垮整个通道 */
		}
	};

	Tunnel.prototype._dispatch = function (frame) {
		if (!frame || typeof frame !== "object") return;
		var id = String(frame.id || "");
		if (frame.t === "http_head") {
			var pending = this.httpPending.get(id);
			if (pending) pending.head = { status: frame.status || 200, headers: frame.headers || {} };
			return;
		}
		if (frame.t === "http_chunk") {
			var chunkPending = this.httpPending.get(id);
			if (chunkPending) {
				try { chunkPending.chunks.push(b64ToBytes(frame.data)); } catch (error) {}
			}
			return;
		}
		if (frame.t === "http_end") {
			var endPending = this.httpPending.get(id);
			if (!endPending) return;
			this.httpPending.delete(id);
			clearTimeout(endPending.timer);
			var body = null;
			if (endPending.chunks.length) {
				var total = 0;
				endPending.chunks.forEach(function (chunk) { total += chunk.length; });
				var merged = new Uint8Array(total);
				var offset = 0;
				endPending.chunks.forEach(function (chunk) { merged.set(chunk, offset); offset += chunk.length; });
				body = merged;
			}
			var status = endPending.head ? endPending.head.status : 200;
			var headers = endPending.head ? endPending.head.headers : {};
			try {
				var response = new Response((status === 204 || status === 304) ? null : body, {
					status: status,
					headers: headers
				});
				endPending.resolve(response);
			} catch (error) {
				endPending.reject(error);
			}
			return;
		}
		if (frame.t === "http_error") {
			var errPending = this.httpPending.get(id);
			if (errPending) {
				this.httpPending.delete(id);
				clearTimeout(errPending.timer);
				errPending.reject(new Error(frame.error || ("HTTP " + (frame.status || 502))));
			}
			return;
		}
		if (frame.t === "ws_open_ok" || frame.t === "ws_open_error" || frame.t === "ws_msg" || frame.t === "ws_close" || frame.t === "ws_error") {
			var vws = null;
			this.virtualSockets.forEach(function (item) {
				if (item.tunnelId === id) vws = item;
			});
			if (!vws) return;
			if (frame.t === "ws_open_ok") vws._onOpen();
			else if (frame.t === "ws_open_error") vws._onError(frame.error || "websocket open failed");
			else if (frame.t === "ws_msg") {
				if (frame.binary) {
					var bytes = b64ToBytes(frame.data);
					vws._onMessage(bytes.buffer, true);
				} else {
					vws._onMessage(String(frame.data == null ? "" : frame.data), false);
				}
			} else if (frame.t === "ws_close") vws._onClose(frame.code || 1000, frame.reason || "");
			else if (frame.t === "ws_error") vws._onError("websocket error");
			return;
		}
	};

	Tunnel.prototype._closeVirtualSockets = function () {
		this.virtualSockets.forEach(function (vws) { vws._onClose(1006, "relay disconnected"); });
		this.virtualSockets.clear();
	};

	Tunnel.prototype.request = function (method, path, headers, body) {
		var self = this;
		return new Promise(function (resolve, reject) {
			var id = String(self.nextId++);
			var frame = {
				t: "http",
				id: id,
				method: method || "GET",
				path: path || "/",
				headers: headers || {},
				pair: self.link.pair,
				body: body || ""
			};
			var timer = setTimeout(function () {
				if (!self.httpPending.has(id)) return;
				self.httpPending.delete(id);
				reject(new Error("请求超时"));
			}, 35000);
			self.httpPending.set(id, { resolve: resolve, reject: reject, timer: timer, head: null, chunks: [] });
			self._sendFrame(frame);
		});
	};

	Tunnel.prototype.fetch = function (input, init) {
		var self = this;
		return Promise.resolve().then(function () {
			var request = input;
			var options = init || {};
			if (request instanceof Request) {
				return request.arrayBuffer().then(function (buffer) {
					return self._doFetch(request.url, request.method, request.headers, buffer.length ? bytesToB64(new Uint8Array(buffer)) : "");
				});
			}
			var url = new URL(String(request), location.href);
			if (url.origin !== location.origin) {
				if (!nativeFetch) throw new Error("native fetch unavailable");
				return nativeFetch(input, init);
			}
			var headers = new Headers(options.headers || {});
			var headerObj = {};
			headers.forEach(function (value, key) { headerObj[key] = value; });
			var body = options.body;
			return readBody(body).then(function (body64) {
				return self._doFetch(url.href, options.method || "GET", headerObj, body64);
			});
		});
	};

	Tunnel.prototype._doFetch = function (absoluteUrl, method, headers, body64) {
		var url = new URL(absoluteUrl, location.href);
		return this.request(method, url.pathname + url.search, headers, body64);
	};

	Tunnel.prototype.openVirtualSocket = function (vws) {
		this.virtualSockets.add(vws);
		vws.tunnelId = String(this.nextId++);
		this._sendFrame({ t: "ws_open", id: vws.tunnelId, path: "/ws", headers: { "x-mbridge-pair": this.link.pair }, pair: this.link.pair });
	};

	Tunnel.prototype.closeVirtualSocket = function (vws) {
		this.virtualSockets.delete(vws);
		this._sendFrame({ t: "ws_close", id: vws.tunnelId, code: 1000, reason: "client close" });
	};

	function readBody(body) {
		return Promise.resolve().then(function () {
			if (body == null) return "";
			if (typeof body === "string") return bytesToB64(utf8(body));
			if (body instanceof URLSearchParams) return bytesToB64(utf8(body.toString()));
			if (typeof Blob !== "undefined" && body instanceof Blob) {
				return body.arrayBuffer().then(function (buffer) { return bytesToB64(new Uint8Array(buffer)); });
			}
			if (body instanceof ArrayBuffer) return bytesToB64(new Uint8Array(body));
			if (ArrayBuffer.isView(body)) return bytesToB64(new Uint8Array(body.buffer, body.byteOffset, body.byteLength));
			throw new Error("unsupported request body");
		});
	}

	/* ── virtual WebSocket ─────────────────────────────────────────── */

	function VirtualWebSocket(url) {
		this.url = String(url);
		this.readyState = 0;
		this.onopen = null;
		this.onmessage = null;
		this.onclose = null;
		this.onerror = null;
		this._listeners = {};
		this._sendQueue = [];
		this.tunnelId = null;
		var parsed = new URL(this.url, location.href);
		if (parsed.pathname !== "/ws") throw new Error("unsupported websocket path");
		if (!tunnel) throw new Error("tunnel not connected");
		tunnel.openVirtualSocket(this);
	}
	VirtualWebSocket.CONNECTING = 0;
	VirtualWebSocket.OPEN = 1;
	VirtualWebSocket.CLOSING = 2;
	VirtualWebSocket.CLOSED = 3;
	VirtualWebSocket.prototype.CONNECTING = 0;
	VirtualWebSocket.prototype.OPEN = 1;
	VirtualWebSocket.prototype.CLOSING = 2;
	VirtualWebSocket.prototype.CLOSED = 3;
	VirtualWebSocket.prototype.addEventListener = function (type, listener) {
		if (!listener) return;
		if (!this._listeners[type]) this._listeners[type] = [];
		this._listeners[type].push(listener);
	};
	VirtualWebSocket.prototype.removeEventListener = function (type, listener) {
		var list = this._listeners[type];
		if (!list) return;
		var index = list.indexOf(listener);
		if (index >= 0) list.splice(index, 1);
	};
	VirtualWebSocket.prototype._emit = function (type, event) {
		var handler = this["on" + type];
		if (typeof handler === "function") {
			try { handler.call(this, event); } catch (error) { console.error(error); }
		}
		var list = this._listeners[type] || [];
		list.slice().forEach(function (listener) {
			try {
				if (typeof listener === "function") listener.call(this, event);
				else if (listener && typeof listener.handleEvent === "function") listener.handleEvent(event);
			} catch (error) { console.error(error); }
		}, this);
	};
	VirtualWebSocket.prototype.send = function (data) {
		if (this.readyState === 0) {
			this._sendQueue.push(data);
			return;
		}
		if (this.readyState !== 1) throw new Error("websocket is not open");
		var binary = typeof data !== "string";
		var payload = binary
			? bytesToB64(data instanceof ArrayBuffer ? new Uint8Array(data) : new Uint8Array(data.buffer, data.byteOffset, data.byteLength))
			: String(data);
		tunnel._sendFrame({ t: "ws_send", id: this.tunnelId, data: payload, binary: binary });
	};
	VirtualWebSocket.prototype.close = function (code, reason) {
		if (this.readyState === 3) return;
		this.readyState = 2;
		try { tunnel.closeVirtualSocket(this); } catch (error) {}
		this._onClose(code || 1000, reason || "");
	};
	VirtualWebSocket.prototype._onOpen = function () {
		if (this.readyState !== 0) return;
		this.readyState = 1;
		var queue = this._sendQueue;
		this._sendQueue = [];
		var self = this;
		queue.forEach(function (item) { try { self.send(item); } catch (error) {} });
		this._emit("open", new Event("open"));
	};
	VirtualWebSocket.prototype._onMessage = function (data, binary) {
		if (this.readyState !== 1) return;
		this._emit("message", new MessageEvent("message", { data: data }));
	};
	VirtualWebSocket.prototype._onClose = function (code, reason) {
		if (this.readyState === 3) return;
		this.readyState = 3;
		if (tunnel) tunnel.virtualSockets.delete(this);
		this._emit("close", new CloseEvent("close", { code: code, reason: reason, wasClean: code !== 1006 }));
	};
	VirtualWebSocket.prototype._onError = function (message) {
		this._emit("error", new Event("error"));
		this._onClose(1006, String(message || "error"));
	};

	/* ── install shims ─────────────────────────────────────────────── */

	function installShims() {
		window.WebSocket = VirtualWebSocket;
		window.fetch = function (input, init) { return tunnel.fetch(input, init); };
		if (window.navigator && navigator.serviceWorker) {
			try { navigator.serviceWorker.register = function () { return Promise.reject(new Error("service worker disabled in tunnel mode")); }; } catch (error) {}
		}
	}

	/* ── boot ──────────────────────────────────────────────────────── */

	function loadHtml() {
		return tunnel.request("GET", "/", { "x-mbridge-pair": tunnel.link.pair }, "")
			.then(function (response) {
				if (!response.ok) throw new Error("获取移动端页面失败 HTTP " + response.status);
				return response.text();
			});
	}

	function start(link) {
		showError("");
		setStatus("warn", "连接中继…");
		tunnel = new Tunnel(link);
		tunnel.connect().then(function () {
			return loadHtml();
		}).then(function (html) {
			documentWritten = true;
			installShims();
			document.open();
			document.write(html);
			document.close();
		}).catch(function (error) {
			setStatus("err", "连接失败");
			showError(String(error && error.message ? error.message : error));
			ui.connect.disabled = false;
		});
	}

	function resolveLink() {
		var fromHash = "";
		var match = location.hash.match(/#connect=/);
		if (match) fromHash = location.href.slice(location.href.indexOf("#") + 1);
		var stored = "";
		try { stored = localStorage.getItem(PAIR_KEY) || ""; } catch (error) {}
		var raw = fromHash || stored;
		var parsed = parseLink(raw);
		if (parsed) {
			try { localStorage.setItem(PAIR_KEY, raw); } catch (error) {}
			if (fromHash) {
				try { history.replaceState(null, "", location.pathname + location.search); } catch (error) {}
			}
			return parsed;
		}
		return null;
	}

	var initial = resolveLink();
	if (initial) {
		ui.link.value = "";
		ui.connect.disabled = true;
		start(initial);
	} else {
		ui.connect.disabled = false;
	}

	ui.connect.addEventListener("click", function () {
		var parsed = parseLink(ui.link.value);
		if (!parsed) {
			showError("配对链接格式不正确，请从电脑设置页复制完整链接");
			return;
		}
		try { localStorage.setItem(PAIR_KEY, ui.link.value.trim()); } catch (error) {}
		ui.connect.disabled = true;
		start(parsed);
	});
})();
</script>
</body>
</html>
